# serene v5.3.1
#
# - docs: https://github.com/isunjn/serene/blob/latest/USAGE.md
# - check for updates: https://github.com/isunjn/serene/releases
#
#=========================================================================================

base_url = "https://udqy.github.io/"
title = "Uday Jadhav"
description = "Making machines think, living in Linux, and roaming the internet."
default_language = "en"
theme = "serene"
output_dir = "public"
compile_sass = true
minify_html = false # Keep this false, as it may cause issues with some styles
build_search_index = false # Keep this false, search is temporarily unsupported
generate_feeds = true # Whether to generate a feed file in root, read docs for more info about rss feed
feed_filenames = ["feed.xml"] # "feed.xml" | "atom.xml" | "rss.xml", read docs for more info
taxonomies = [{ name = "tags" }, { name = "categories" }]

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"
render_emoji = true
external_links_target_blank = true
external_links_no_follow = true
external_links_no_referrer = true
smart_punctuation = false

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

#=========================================================================================

[extra]

sections = [
  { name = "Blog", path = "/blog", is_external = false },
  { name = "Work", path = "/work", is_external = false },
]
blog_section_path = "/blog"
work_section_path = "/work"

back_link_text = "Back" # Text of the back button
force_theme = false # false | "light" | "dark"

footer_copyright = "© 2025 Uday Jadhav"
footer_credits = false # Whether to show "Built with zola and serene" in footer

not_found_error_text = "404 Not Found"
not_found_recover_text = "« back to home »"

reaction = true # Whether to enable anonymous emoji reactions (Note: You need to set up a working api endpoint to enable this feature)
reaction_align = "left" # "left" | "center" | "right"
reaction_endpoint = "https://jbueblpurujnowslnroy.supabase.co/functions/v1/reactions"

# Visitor count on the homepage, proxied from Umami (the API key stays server-side).
# Leave empty to hide the line entirely.
visitors_endpoint = "https://jbueblpurujnowslnroy.supabase.co/functions/v1/visitors"
visitors_text = "visitors so far"
